name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node >=22.15 才有 zlib.zstdDecompressSync（index.js 顶层就用它读 .zstd 会话日志）；
          # 本机生产运行时是 v24 ⇒ CI 与生产对齐。
          # 真因记录：Node 20 上 `import { zstdDecompressSync } from 'node:zlib'` 直接
          # SyntaxError（does not provide an export named ...）⇒ 此前每一次 push 的 CI 都是红的。
          node-version: 24

      - name: Syntax check
        run: node --check index.js && node --check helper.cjs

      - name: Install deps
        run: npm i --no-save

      - name: Smoke test
        run: npm run smoke

      - name: Secret scan
        run: |
          if grep -rEn 'cli_[a-zA-Z0-9]{16,}|sk-[a-zA-Z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE|ghp_[a-zA-Z0-9]{20,}' \
            --include='*.js' --include='*.cjs' --include='*.mjs' \
            --include='*.json' --include='*.md' --include='*.yml' --include='*.yaml' . \
            | grep -vE 'cli_xxxxxxxxxxxxxxxx|your_app_secret' ; then
            echo "::error::Potential secret found in repository"
            exit 1
          fi
          echo "Secret scan clean"
